<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Look up the country and region for a three-digit +1 telephone area code.">
  <title>Area Code Lookup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 24px;
      background: #f7f8fa;
      color: #162134;
      font: 1rem / 1.5 system-ui, sans-serif;
    }
    main {
      max-width: 360px;
      margin: 0 auto;
      padding: clamp(48px, 14vh, 144px) 0 40px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: -.035em;
    }
    label, .note, footer { color: #4f5c70; font-size: .875rem; }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 10px 14px;
      border: 1px solid #8390a3;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: 600 1.5rem / 1.4 system-ui, sans-serif;
      letter-spacing: .08em;
    }
    input::placeholder { color: #637186; }
    input:focus-visible { outline: 2px solid #2454a4; outline-offset: 3px; }
    input[aria-invalid="true"] { border-color: #a32938; }
    #result:not(:empty) {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #d7dde7;
    }
    .region { margin: 0; font-size: 1.25rem; font-weight: 650; }
    .country, .note { margin: 2px 0 0; }
    .country { color: #4f5c70; }
    footer { margin-top: 24px; }
    a { color: inherit; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Area Code Lookup</h1>
    <label for="code">Three-digit area code (+1)</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="off"
      spellcheck="false" placeholder="---">
    <div id="result" role="status" aria-atomic="true"></div>
    <noscript><p>Enable JavaScript to look up an area code.</p></noscript>
    <footer><a href="https://www.nanpa.com/reports/npa-reports"></a></footer>
  </main>

    "980": ["United States", "North Carolina"],
    "983": ["United States", "Colorado"],
    "984": ["United States", "North Carolina"],
    "985": ["United States", "Louisiana"],
    "986": ["United States", "Idaho"],
    "989": ["United States", "Michigan"]
  }
  </script>
  <script>
    const areaCodes = JSON.parse(document.querySelector('#area-codes').textContent);
    const input = document.querySelector('#code');
    const result = document.querySelector('#result');

    function resultLine(className, value) {
      const line = document.createElement('p');
      line.className = className;
      line.textContent = value;
      return line;
    }

    function lookup() {
      const code = input.value.trim();

      if (!/^[0-9]{0,3}$/.test(code)) {
        input.setAttribute('aria-invalid', 'true');
        result.replaceChildren(resultLine('note', 'Enter exactly three digits.'));
        return;
      }

      input.removeAttribute('aria-invalid');
      if (code.length < 3) {
        result.replaceChildren();
        return;
      }

      const match = areaCodes[code];
      if (!match) {
        result.replaceChildren(resultLine('note', 'No +1 area code found for ' + code + '.'));
        return;
      }

      const [country, region, status, service] = match;
      const lines = region === 'Country or territory-wide'
        ? [resultLine('region', country)]
        : [resultLine('region', region), resultLine('country', country)];
      if (service) {
        lines.push(resultLine('note', service));
      } else if (status === 'service') {
        lines.push(resultLine('note', 'Non-geographic service'));
      }
      if (status === 'planned' || status === 'planned-service') {
        lines.push(resultLine('note', 'Assigned for future use.'));
      }
      result.replaceChildren(...lines);
    }

    input.addEventListener('input', lookup);
    window.addEventListener('pageshow', lookup);
  </script>
</body>
</html>
